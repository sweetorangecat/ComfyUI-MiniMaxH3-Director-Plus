name: Frontend workflow state

on:
  push:
    branches: [main]
    paths:
      - "js/**"
      - "examples/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/frontend-state.yml"
  pull_request:
    paths:
      - "js/**"
      - "examples/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/frontend-state.yml"

permissions:
  contents: read

jobs:
  workflow-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Native widget save and restore regressions
        run: node --test tests/js/*.test.mjs
      - name: Frontend and workflow generator contracts
        run: python -m pytest -q tests/test_frontend_source.py tests/test_frontend_state.py tests/test_workflow_tools.py tests/test_sampling_menu_rollback.py
